<header *ngIf="METHOD == 'posts'">
  <div class="bg-1"></div>
</header>

<section>
  <h1>all {{ METHOD }}</h1>
  <a #top id="top"></a>

  <hr />

  <div appImageGrid class="imageGrid">
    <div #posts *ngFor="let image of images">
      <app-post [image]="image"></app-post>
    </div>
  </div>

  <button class="previous" *ngIf="showPrevious" (click)="Page(top, false)">
    <p>PREVIOUS</p>
  </button>
  <button class="next" *ngIf="showNext" (click)="Page(top, true)">
    <p>NEXT</p>
  </button>
</section>

<footer *ngIf="METHOD == 'favorites'">
  <div class="bg-2"></div>
</footer>
