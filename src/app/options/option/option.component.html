<section>
  <h3>
    {{ option.title }}, <strong>{{ preview }}</strong>
  </h3>
  <div class="buttons">
    <button
      *ngFor="let button of option.buttons"
      (click)="toggle(option.type, button.action, button.placeholder)"
    >
      {{ button.placeholder }}
    </button>
  </div>
</section>
