<section>
  <h3>
    {{ options.title }}, <strong>{{ preview }}</strong>
  </h3>
  <div class="buttons">
    <button
      *ngFor="let button of options.buttons"
      (click)="toggle(options.type, button.action, button.placeholder)"
    >
      {{ button.placeholder }}
    </button>
  </div>
</section>
